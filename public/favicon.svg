<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="g" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0A0B0F"/>
  <!-- Three chained legs, stepping up and to the right: the board in miniature. -->
  <g filter="url(#g)">
    <rect x="9"  y="40" width="20" height="7" rx="3.5" fill="#00E5FF"/>
    <rect x="24" y="28" width="17" height="7" rx="3.5" fill="#FF4FD8"/>
    <rect x="37" y="16" width="18" height="7" rx="3.5" fill="#F4B728"/>
  </g>
</svg>
